{% extends "base.html" %}
{% block title %}Sign Up — ToolLab{% endblock %}
{% block content %}
<section style="max-width:400px;margin:60px auto">
  <h1 style="text-align:center;margin-bottom:32px">Sign Up</h1>
  <div class="card">
    <form method="post" action="/auth/signup">
      <label for="email">Email</label>
      <input type="email" name="email" id="email" required placeholder="you@example.com">
      <label for="password" class="mt-16">Password</label>
      <input type="password" name="password" id="password" required placeholder="••••••••" minlength="6">
      <button type="submit" class="btn-lg mt-24" style="width:100%">Create Account →</button>
    </form>
    <p class="text-center mt-16 text-dim">Already have an account? <a href="/auth/login">Login</a></p>
  </div>
</section>
{% endblock %}
